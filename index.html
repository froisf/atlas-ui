<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Agentic</title>
    <style>
        :root { --bg: #0f172a; --sidebar: #0b1120; --panel: #1e293b; --text: #f8fafc; --muted: #94a3b8; --blue: #38bdf8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid #1e293b; padding: 15px; display: flex; flex-direction: column; }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .brand img { width: 40px; height: 40px; border-radius: 8px; background: white; }
        .brand h1 { font-size: 18px; }
        .new-btn { background: var(--panel); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; margin-bottom: 20px; }
        .convo-nav { flex: 1; overflow-y: auto; }
        .convo-item { padding: 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; margin-bottom: 5px; }
        .convo-item.active { background: #1e293b; color: white; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .topbar { padding: 15px 20px; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .topbar h2 { font-size: 16px; }
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { display: flex; gap: 10px; max-width: 80%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; background: var(--panel); line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
        .message.user .msg-bubble { background: #334155; }
        .input-area { padding: 15px 20px; background: var(--bg); }
        .input-box { display: flex; background: #1e293b; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        .input-box textarea { flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; font-size: 15px; padding: 5px; }
        .send-btn { background: var(--blue); color: #0f172a; border: none; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #btn-convert { position: fixed; bottom: 80px; right: 20px; background: #22c55e; color: #000; padding: 15px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); z-index: 100; }
        #modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1e293b; padding: 25px; border-radius: 12px; display: none; width: 400px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .modal-step { margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-step h3 { font-size: 16px; margin-bottom: 5px; }
        .modal-step p { font-size: 13px; color: var(--muted); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <img src="https://ui-avatars.com/api/?name=Atlas&background=0D8ABC&color=fff" alt="Logo">
            <h1>Atlas Agentic</h1>
        </div>
        <button class="new-btn">+ Nova Conversa</button>
        <div class="convo-nav">
            <div class="convo-item active">Bom dia Atlas</div>
            <div class="convo-item">Status projeto Spring AI</div>
            <div class="convo-item">Checkup MEGARAG</div>
        </div>
    </aside>
    <main class="main">
        <header class="topbar">
            <h2>Bom dia Atlas Agentic</h2>
            <span style="color: #22c55e; font-size: 14px;">● Esteira pronta</span>
        </header>
        <div class="chat-area" id="chat-area">
            <div class="message assistant">
                <div class="msg-bubble">Olá Flavio! Sou o Atlas. Digite uma mensagem ou clique em "Iniciar Conversão" para começarmos.</div>
            </div>
        </div>
        <div class="input-area">
            <div class="input-box">
                <textarea id="chat-input" rows="1" placeholder="Mensagem para o Atlas..."></textarea>
                <button class="send-btn" onclick="enviarMensagem()">↑</button>
            </div>
        </div>
    </main>
    <button id="btn-convert" onclick="iniciarConversao()">⚡ Iniciar Conversão (Real)</button>
    <div id="modal">
        <h2 style="margin-bottom: 15px;">Governança da Conversão</h2>
        <div id="modal-steps"></div>
        <button onclick="document.getElementById('modal').style.display='none'" style="width: 100%; padding: 10px; background: #334155; color: white; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer;">Fechar Painel</button>
    </div>
    <script>
        const chatArea = document.getElementById('chat-area');
        const chatInput = document.getElementById('chat-input');
        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<div class="msg-bubble">${text}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        async function enviarMensagem() {
            const texto = chatInput.value.trim();
            if (!texto) return;
            addMessage(texto, 'user');
            chatInput.value = '';
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: texto })
                });
                const dados = await res.json();
                addMessage(dados.response, 'assistant');
            } catch (erro) {
                addMessage("Erro ao conectar com o servidor Python.", 'assistant');
            }
        }
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensagem(); }
        });
        async function iniciarConversao() {
            const btn = document.getElementById('btn-convert');
            btn.innerText = "Conectando...";
            try {
                const res = await fetch('/api/convert', { method: 'POST' });
                const dados = await res.json();
                if(dados.status === 'success') {
                    let html = '';
                    dados.steps.forEach(step => {
                        let cor = step.status === 'green' ? '🟢' : step.status === 'orange' ? '🟡' : '⚪';
                        let corTexto = step.status === 'green' ? '#22c55e' : step.status === 'orange' ? '#f59e0b' : '#94a3b8';
                        html += `<div class="modal-step"><h3 style="color:${corTexto}">${cor} ${step.nome}</h3><p>${step.detalhe}</p></div>`;
                    });
                    document.getElementById('modal-steps').innerHTML = html;
                    document.getElementById('modal').style.display = 'block';
                }
            } catch (erro) { alert("Erro: " + erro.message); }
            btn.innerText = "⚡ Iniciar Conversão (Real)";
        }
    </script>
</body>
</html>
