apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: atlas-agentic
  labels:
    app: vllm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      containers:
      - name: vllm-container
        image: "public.ecr.aws/q9t5s3a7/vllm-cpu-release-repo:latest"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        args: ["--model", "Qwen/Qwen2.5-Coder-1.5B-Instruct", "--port", "8000", "--max-model-len", "512", "--dtype", "bfloat16", "--enforce-eager"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        resources:
          limits:
            memory: "4Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: atlas-agentic
spec:
  selector:
    app: vllm-inference
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP