apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: atlas-agentic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
    spec:
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:v0.6.0
        args: ["--model", "Qwen/Qwen2.5-Coder-14B-Instruct", "--port", "8000", "--max-model-len", "8192"]
        ports:
        - containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: "32Gi"
            cpu: "8"
          requests:
            nvidia.com/gpu: "1"
            memory: "16Gi"
            cpu: "4"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: atlas-agentic
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: vllm-inference
