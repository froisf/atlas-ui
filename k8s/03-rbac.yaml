apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-job-launcher-sa
  namespace: atlas-agentic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-job-launcher-role
  namespace: atlas-agentic
rules:
- apiGroups: ["batch", ""]
  resources: ["jobs", "pods", "pods/log"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-job-launcher-binding
  namespace: atlas-agentic
subjects:
- kind: ServiceAccount
  name: atlas-job-launcher-sa
  namespace: atlas-agentic
roleRef:
  kind: Role
  name: atlas-job-launcher-role
  apiGroup: rbac.authorization.k8s.io
